name: Validate and build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:check
      - run: npm test
      - run: npm run build:static
      - uses: actions/upload-artifact@v7
        with:
          name: call-of-duty-atlas-static
          path: dist-static
          if-no-files-found: error

  publish:
    needs: atlas
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push staging image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/time-wasters/cod-atlas:staging
            ghcr.io/time-wasters/cod-atlas:${{ github.sha }}
          build-args: |
            STEAM_ICON_URL=${{ vars.STEAM_ICON_URL }}
            STEAMGRIDDB_ICON_URL=${{ vars.STEAMGRIDDB_ICON_URL }}