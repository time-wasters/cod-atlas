
services:
  cod-atlas:
    # Official versioned release from GHCR.
    image: ghcr.io/time-wasters/cod-atlas:v1.0.0

    networks:
      - proxy-network

    deploy:
      replicas: 1
      restart_policy:
        condition: any

networks:
  proxy-network:
    external: true
    name: proxy-network
